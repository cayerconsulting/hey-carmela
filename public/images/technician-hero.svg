<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="50%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#14243B"/>
    </linearGradient>
    <linearGradient id="doorLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="porchGlow" cx="82%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="darkFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B192C" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#0B192C" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#0B192C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background Sky & Environment -->
  <rect width="1600" height="900" fill="url(#nightSky)"/>
  
  <!-- Subtle stars / ambient night lights -->
  <circle cx="950" cy="120" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="1120" cy="80" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="1340" cy="150" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="1480" cy="95" r="2.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- Warm ambient light from lit front door on the right -->
  <rect x="900" y="0" width="700" height="900" fill="url(#porchGlow)"/>

  <!-- Suburban House Silhouette & Lit Front Door -->
  <path d="M1100 240 L1350 140 L1600 240 V800 H1100 Z" fill="#0D1A2D"/>
  <polygon points="1060,245 1350,130 1620,245 1600,265 1350,155 1080,265" fill="#1E2D44"/>
  
  <!-- Warm Lit Front Doorway -->
  <rect x="1290" y="360" width="120" height="260" rx="8" fill="#FBBF24"/>
  <rect x="1300" y="375" width="45" height="100" fill="#FEF3C7" opacity="0.85"/>
  <rect x="1355" y="375" width="45" height="100" fill="#FEF3C7" opacity="0.85"/>
  <rect x="1300" y="490" width="45" height="115" fill="#FDE68A" opacity="0.7"/>
  <rect x="1355" y="490" width="45" height="115" fill="#FDE68A" opacity="0.7"/>
  <!-- Porch Light Fixture -->
  <circle cx="1260" cy="380" r="16" fill="#FDE047"/>
  <circle cx="1260" cy="380" r="45" fill="url(#doorLight)"/>

  <!-- Pavement / Driveway -->
  <polygon points="800,900 1600,900 1600,600 1050,600" fill="#111B2B"/>
  <polygon points="650,900 1600,900 1600,640 920,640" fill="#0E1724"/>

  <!-- Service Van parked in driveway -->
  <g transform="translate(860, 480)">
    <!-- Van body shadow -->
    <ellipse cx="230" cy="200" rx="220" ry="25" fill="#050A12" opacity="0.8"/>
    <!-- Van main body -->
    <path d="M40 180 V60 C40 45 55 35 75 35 H310 C330 35 345 50 355 70 L395 125 C405 138 415 155 415 175 V180 Z" fill="url(#vanGrad)"/>
    <!-- Van roof ladder rack -->
    <rect x="80" y="22" width="220" height="6" fill="#64748B"/>
    <rect x="100" y="10" width="180" height="12" fill="#E2E8F0" opacity="0.9"/>
    <!-- Van side window / cab window -->
    <path d="M320 50 H345 L385 110 H320 Z" fill="#0F172A"/>
    <!-- Van side branding stripe -->
    <path d="M40 120 H410 V132 H40 Z" fill="#F59E0B" opacity="0.9"/>
    <!-- Van Wheels -->
    <circle cx="120" cy="185" r="38" fill="#0F172A"/>
    <circle cx="120" cy="185" r="22" fill="#475569"/>
    <circle cx="340" cy="185" r="38" fill="#0F172A"/>
    <circle cx="340" cy="185" r="22" fill="#475569"/>
    <!-- Van Headlight beam softly illuminating front -->
    <polygon points="415,145 550,130 570,180 415,165" fill="#FEF3C7" opacity="0.15"/>
  </g>

  <!-- Service Technician walking toward lit front door -->
  <g transform="translate(1220, 420)">
    <!-- Technician Shadow -->
    <ellipse cx="25" cy="265" rx="35" ry="12" fill="#060B14" opacity="0.75"/>
    <!-- Tool Bag / Equipment -->
    <rect x="52" y="175" width="28" height="35" rx="5" fill="#B45309"/>
    <path d="M60 175 V160 H72 V175" stroke="#78350F" stroke-width="4" fill="none"/>
    <!-- Body / Uniform Jacket (Professional navy work uniform) -->
    <path d="M12 95 C12 75 42 75 42 95 L48 185 H6 Z" fill="#1E3A8A"/>
    <!-- High-vis reflective safety vest accent -->
    <path d="M15 115 H39 V145 H15 Z" fill="#F59E0B"/>
    <rect x="15" y="125" width="24" height="6" fill="#FFFFFF" opacity="0.9"/>
    <!-- Legs / Work Trousers -->
    <rect x="10" y="180" width="14" height="80" rx="4" fill="#0F172A"/>
    <rect x="28" y="180" width="14" height="78" rx="4" fill="#0F172A"/>
    <!-- Boots -->
    <rect x="6" y="255" width="22" height="14" rx="4" fill="#451A03"/>
    <rect x="26" y="253" width="22" height="14" rx="4" fill="#451A03"/>
    <!-- Head / Work Cap -->
    <circle cx="26" cy="62" r="16" fill="#FCD34D"/>
    <path d="M14 60 C14 46 38 46 38 60 H48 V66 H14 Z" fill="#1E3A8A"/>
    <path d="M36 60 H52 V64 H36 Z" fill="#1E3A8A"/>
  </g>

  <!-- Left Side Dark Vignette Overlay for Crisp Readability of Headline & CTA -->
  <rect x="0" y="0" width="950" height="900" fill="url(#darkFade)"/>
</svg>
